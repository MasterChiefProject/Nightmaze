name: WebGL Shell CI

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'ASSET-NOTICE.md'
      - 'docs/**'
      - 'Assets/Scripts/**'
      - 'Assets/Editor/**'
      - 'Assets/WebGLTemplates/**'
      - 'ProjectSettings/EditorBuildSettings.asset'
      - 'ProjectSettings/ProjectVersion.txt'
      - 'tests/**'
      - '.github/workflows/webgl-shell.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'ASSET-NOTICE.md'
      - 'docs/**'
      - 'Assets/Scripts/**'
      - 'Assets/Editor/**'
      - 'Assets/WebGLTemplates/**'
      - 'ProjectSettings/EditorBuildSettings.asset'
      - 'ProjectSettings/ProjectVersion.txt'
      - 'tests/**'
      - '.github/workflows/webgl-shell.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment and source contracts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            README.md
            ASSET-NOTICE.md
            docs
            Assets/Scripts
            Assets/Editor
            Assets/WebGLTemplates
            ProjectSettings/EditorBuildSettings.asset
            ProjectSettings/ProjectVersion.txt
            tests
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check browser shell syntax
        run: node --check docs/TemplateData/shell.js

      - name: Run repository checks
        run: node --test tests/repository.test.mjs
